name: Deploy frontend to GCP
on:
  workflow_dispatch: # allows for manual invocation
  workflow_run:
    workflows: [Test and lint]
    types:
      - completed
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
    - id: 'checkout'
      uses: 'actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744' # v3

    - id: 'auth'
      name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@3a3c4c57d294ef65efaaee4ff17b22fa88dd3c69' # v1
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      with:
        credentials_json: '${{ secrets.GOOGLE_CREDENTIALS }}'

    - id: 'install-dependencies'
      name: 'Install dependencies'
      run: yarn install

    - id: 'build-staging'
      name: 'Build Staging'
      run: yarn build

    - id: 'upload-folder-staging'
      name: 'Upload Staging'
      uses: 'google-github-actions/upload-cloud-storage@e95a15f226403ed658d3e65f40205649f342ba2c' # v1
      with:
        path: 'out'
        destination: 'bioacoustics-devseed-staging-frontend'
        parent: false
        predefinedAcl: publicRead
